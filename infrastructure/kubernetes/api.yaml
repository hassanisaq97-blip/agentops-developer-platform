apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-api
  namespace: agentops
spec:
  replicas: 2 # statsløs (state ligger i Postgres) — kan skaleres horisontalt
  selector:
    matchLabels:
      app: agentops-api
  template:
    metadata:
      labels:
        app: agentops-api
    spec:
      containers:
        - name: api
          image: agentops-api:latest # bygget lokalt fra docker/api.Dockerfile — se docs/security.md
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: agentops-config }
            - secretRef: { name: agentops-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-api
  namespace: agentops
spec:
  selector:
    app: agentops-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
