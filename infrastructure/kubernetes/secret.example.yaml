# EKSEMPEL — ikke et rigtigt secret. Kopiér denne fil, udfyld værdierne, og
# apply'ér den kopi (som ALDRIG må committes) — eller, i en rigtig klynge, brug
# en secrets-manager-integration (fx External Secrets Operator mod Azure Key
# Vault, se infrastructure/terraform/) i stedet for at maile et YAML-secret
# rundt.
apiVersion: v1
kind: Secret
metadata:
  name: agentops-secrets
  namespace: agentops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql+psycopg://agentops:CHANGE_ME@postgres:5432/agentops"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
