[project]
name = "agentops-developer-platform"
version = "0.1.0"
description = "Observerbar og evaluerbar AI-platform til agent-assisteret softwareudvikling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "mcp>=1.9",
    "anthropic>=0.40",
    "openai>=1.55",
    "mlflow-skinny>=2.18",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pytest>=8.3",
    # pytest er en runtime-afhængighed, ikke kun et devværktøj: MCP-serverens
    # `run_tests`-tool kører pytest MOD målrepositoryet på vegne af agenten.
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Body() in argument defaults is the documented,
# required pattern for dependency injection — not the mutable-default-argument
# bug B008 normally guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (Postgres, MLflow)",
    "llm: requires a real LLM provider API key",
]

[tool.coverage.run]
source = ["src/agentops"]
